name: 'Pull Request: Verify'

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 'Lint / Check / Test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm, Node.js, and install dependencies
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test
