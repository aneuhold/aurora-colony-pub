name: 'Main Branch: Deploy Site'

# Root files (lockfile, base tsconfig, this workflow, etc.) can affect the
# site build, so they're listed alongside `site/**` to force a deploy when
# they change.
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/main-branch-site.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-site:
    name: 'Deploy site to Cloudflare Pages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm, Node.js, and install dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true

      - name: Build site
        run: pnpm build:site

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=aurora-colony-pub-frontend --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
